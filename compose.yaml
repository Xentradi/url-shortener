name: url-shortener

services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - ./secrets/app.env
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/urlShortener
      API_HOST: api.x3n.us
      WEB_HOSTS: x3n.us,www.x3n.us
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app
    volumes:
      - ./data/logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    networks:
      - app
    volumes:
      - ./data/mongo:/data/db
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    networks:
      app: {}
      edge:
        aliases:
          - shorturl-proxy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true

networks:
  app:
    internal: true
  edge:
    external: true
    name: edge
